<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>oscmix Generic</title>
		<link rel="icon" href="img/favicon.png" type="image/x-icon">
		<link rel="preload" href="css/theme/tm_dark_hi.css" as="style" />
		<link rel="stylesheet" href="css/theme/tm_dark_hi.css" />
		<link rel="stylesheet" href="css/base.css" />

		<link rel="preload" href="css/help.css" as="style" />
		<link rel="stylesheet" href="css/help.css" media="print" onload="this.media='all'" />
		<link rel="stylesheet" href="css/knob.css" />
		<link rel="stylesheet" href="css/button.css" />
		<link rel="stylesheet" href="css/channelEq.css" />

		<link rel="modulepreload" href="js/oscmix.js" />
	</head>
	<body>
		<template id="channel-template">
			<div class="channel-outer">
				<input id="submix" class="submix" type="radio" form="view" name="submix" data-type="output" />
				<div class="channel">
					<form id="channel-name-form" class="channel-name-form">
						<input id="channel-name" class="channel-name" />
					</form>
					<label id="pan">					
						<div class="knob-target"></div>
					</label>
					<div class="channel-mute">
						<!-- Buttons inserted by JS; hidden inputs are CSS-state proxies -->
						<input class="mute-checkbox"   type="checkbox" hidden />
						<input class="solo-checkbox"   type="checkbox" hidden />
						<input class="record-checkbox" type="checkbox" hidden />
						<input class="play-checkbox"   type="checkbox" hidden />
					</div>
					<div id="channel-meter-value" class="channel-meter-value">
						<div id="volume-meter-value">UFL</div>
					</div>
					<div id="channel-volume" class="channel-volume">
						<div id="volume-meter" class="meter-wrapper">
							<div class="meter-fill" style="height: 0%"></div>
						</div>
						<input
						id="volume-range"
						type="range"
						orient="vertical"
						min="-65"
						max="6"
						step="0.1"
						value="-65"
						/>
						<div class="channel-panel-buttons">
							<label class="toggle-button channel-show-settings-label"
								>S<input type="checkbox" class="channel-show-settings"
								/></label>
							<label class="toggle-button channel-show-eq-label" data-type="input output"
								>EQ<input type="checkbox" class="channel-show-eq"
								/></label>
							<label class="toggle-button channel-show-dynamics-label" data-type="input output"
								>D<input type="checkbox" class="channel-show-dynamics"
								/></label>
						</div>
					</div>
					<input
					class="channel-volume-number"
					id="volume-number"
					type="number"
					min="-65"
					max="6"
					value="-65"
					step="0.5" />
					<select class="channel-volume-output" id="volume-output" data-type="input playback"></select>
				</div>
				<div class="channel-panel channel-panel-settings">
					<fieldset>
						<label><span><input type="checkbox" class="stereo" data-osc="stereo" hidden /></span></label>
						<div class="btn-pair">
							<label data-flags="48v"><span><input type="checkbox" class="phantom" data-osc="48v" hidden /></span></label>
							<label data-flags="hi-z"><span><input type="checkbox" class="hi-z" data-osc="hi-z" hidden /></span></label>
						</div>
						<label data-flags="reflevel">
							<span class="settings-label-text">Ref. Level</span>
							<select id="reflevel"><!-- populated from device def --></select>
						</label>
						<label data-flags="gain"><div class="knob-target"></div></label>
						<label data-flags="autoset"><span><input type="checkbox" data-osc="autoset" hidden /></span></label>
						<label><div class="knob-target fx-knob-target"></div></label>
						<label data-type="output"><select id="crossfeed" class="crossfeed">
							<option>x-feed off</option>
							<option>x-feed 1</option>
							<option>x-feed 2</option>
							<option>x-feed 3</option>
							<option>x-feed 4</option>
							<option>x-feed 5</option>
						</select></label>
						<label class="width-row" data-type="input playback"><div class="knob-target width-knob-target"></div></label>
						<label class="stereo-field"><span><input type="checkbox" data-osc="msproc" hidden /></span></label>
						<div class="btn-pair">
							<label><span><input type="checkbox" data-osc="phase" hidden /></span></label>
							<label class="stereo-field phase-r-row"><span class="phase-r-host"></span></label>
						</div>
						<label data-type="output"><span><input type="checkbox" class="loopback" data-osc="loopback" hidden /></span></label>
						<button id="roomeq-show" data-type="output" class="roomeq btn btn-channel btn-toggle">Room EQ</button>
					</fieldset>
				</div>
				<div class="channel-panel channel-panel-eq" data-type="input output">
					<!-- Hidden checkboxes mirror EQ/LC enabled state so CSS :has() can glow the EQ label. -->
					<input type="checkbox" class="eq" hidden />
					<input type="checkbox" class="lowcut" hidden />
					<!-- Built lazily by Channel#initEQ on first open of the EQ panel. -->
					<div class="ch-eq-host"></div>
				</div>
				<div class="channel-panel channel-panel-dynamics" data-type="input output">
					<details open>
						<summary>Dynamics<input id="dynamics" class="dynamics" type="checkbox" /></summary>
						<fieldset>
							<label>Gain<input id="dynamics/gain" type="number" min="-30" max="30" step="0.5" /></label>
							<label>Attack<input id="dynamics/attack" type="number" min="0" max="200" step="1" /></label>
							<label
								>Release<input id="dynamics/release" type="number" min="100" max="999" step="1"
								/></label>
							<label
								>Comp. Thres.<input id="dynamics/compthres" type="number" min="-60" max="0" step="0.5"
								/></label>
							<label
								>Comp. Ratio<input id="dynamics/compratio" type="number" min="1" max="10" step="0.1"
								/></label>
							<label
								>Exp. Thres.<input id="dynamics/expthres" type="number" min="-99" max="-20" step="0.5"
								/></label>
							<label
								>Exp. Ratio<input id="dynamics/expratio" type="number" min="1" max="10" step="0.1"
								/></label>
						</fieldset>
					</details>
					<details open>
						<summary>Auto Level<input id="autolevel" class="autolevel" type="checkbox" /></summary>
						<fieldset>
							<label>Max Gain
								<input id="autolevel/maxgain" type="number" min="0" max="18" step="0.5"/>
							</label>
							<label>Headroom
								<input id="autolevel/headroom" type="number" min="3" max="12" step="0.5"/></label>
							<label>Rise Time
								<input id="autolevel/risetime" type="number" min="0.1" max="9.9" step="0.1"/>
							</label>
						</fieldset>
					</details>
				</div>
			</div>
		</template>
		
		<!-- Channels -->
		<div id="channels">
			<details open><summary>Inputs</summary></details>
			<div id="inputs" class="channel-strip"></div>
			<hr />
			<details open><summary>Playbacks</summary></details>
			<div id="playbacks" class="channel-strip"></div>
			<hr />
			<details open><summary>Outputs</summary></details>
			<div id="outputs" class="channel-strip"></div>
		</div>
		
		<!-- Sidebar -->
		<div id="sidebar">
			<details open>
				<summary>Connection<span id="connection-icon"></span></summary>
				<form id="connection">
					<fieldset class="custom-form">
						<label class="form-row">Type
							<select id="connection-type">
								<option id="connection-type-websocket" selected>WebSocket</option>
								<option id="connection-type-midi">MIDI</option>
							</select>
						</label>
						<label class="connection-midi form-row">MIDI Input
							<select id="connection-midi-input"></select>
						</label>
						<label class="connection-midi form-row">MIDI Output
							<select id="connection-midi-output"></select>
						</label>
						<label class="connection-websocket form-row">Server
							<input id="connection-websocket-address" size="1" value="ws://localhost:8222" />
						</label>
						<div class="durec-controls">
							<button id="connection-connect">Connect</button>
							<button id="connection-disconnect">Disconnect</button>
							<button id="connection-refresh">Refresh</button>
							<button id="connection-reinitialise">Reinitialise</button>
						</div>
					</fieldset>
				</form>
			</details>
			<hr />

			<details open>
				<summary>
					Global
				</summary>
				<form id="global">
					<fieldset class="custom-form">
							<label class="form-row">Mute
								<div class="switch">
									<input id="controlroom-muteenable" type="checkbox" />
									<span class="slider"></span>
								</div>
							</label>
							<label class="form-row">Solo
								<div class="switch">
									<input id="main-soloenable" type="checkbox" />
									<span class="slider"></span>
								</div>
							</label>
							<label class="form-row">Fadergroup
								<div class="switch">
									<input id="main-adhocfaderenable" type="checkbox" />
									<span class="slider"></span>
								</div>
							</label>
							<label class="form-row">DSP Load
								<span class="dsp-load-wrapper">
									<meter id="hardware-dspload-meter" min="0" max="100" low="70" high="90" optimum="0"></meter>
								</span>
							</label>
							<label class="form-row">DSP Version<output id="hardware-dspvers"></output></label>
					</fieldset>
				</form>
			</details>
			<hr />
			<details>
				<summary>Reverb
					<label class="switch">
						<input id="reverb-enabled" type="checkbox" />
						<span class="slider"></span>
					</label>
				</summary>
				<fieldset>
					<label>Type
						<select id="reverb-type">
							<option>Small Room</option>
							<option>Medium Room</option>
							<option>Large Room</option>
							<option>Walls</option>
							<option>Shorty</option>
							<option>Attack</option>
							<option>Swagger</option>
							<option>Old School</option>
							<option>Echoistic</option>
							<option>8plus9</option>
							<option>Grand Wide</option>
							<option>Thicker</option>
							<option>Envelope</option>
							<option>Gated</option>
							<option>Space</option>
						</select>
					</label>
					<label>Pre Delay<input id="reverb-predelay" type="number" min="0" max="999" step="1" /></label>
					<label>Low Cut<input id="reverb-lowcut" type="number" min="20" max="500" step="1" /></label>
					<label>Room Scale<input id="reverb-roomscale" type="number" min="0.5" max="3" step="0.01" /></label>
					<label>Attack<input id="reverb-attack" type="number" min="5" max="400" step="1" /></label>
					<label>Hold<input id="reverb-hold" type="number" min="5" max="400" step="1" /></label>
					<label>Release<input id="reverb-release" type="number" min="5" max="400" step="1" /></label>
					<label>High Cut<input id="reverb-highcut" type="number" min="2000" max="20000" step="100" /></label>
					<label>Time<input id="reverb-time" type="number" min="0.1" max="4.9" step="0.1" /></label>
					<label>High Damp<input id="reverb-highdamp" type="number" min="2000" max="20000" step="100"/></label>
					<label>Smooth<input id="reverb-smooth" type="number" min="0" max="100" step="1" /></label>
					<label>Volume<input id="reverb-volume" type="number" min="-65" max="6" step="0.5" /></label>
					<label>Width<input id="reverb-width" type="number" min="0" max="1" step="0.01" /></label>
				</fieldset>
			</details>
			<hr />	
			<details>
				<summary>Echo
					<label class="switch">
						<input id="echo-enabled" type="checkbox" />
						<span class="slider"></span>
					</label>
				</summary>
				<fieldset>
					<label>Type
						<select id="echo-type">
							<option>Stereo Echo</option>
							<option>Stereo Cross</option>
							<option>Pong Echo</option>
						</select></label>
					<label>Delay<input id="echo-delay" type="number" min="0" max="2" step="0.01" /></label>
					<label>Feedback<input id="echo-feedback" type="number" min="0" max="100" step="1" /></label>
					<label>Width<input id="echo-width" type="number" min="0" max="1" step="0.01" /></label>
					<label>High Cut
						<select id="echo-highcut">
							<option>Off</option>
							<option>16 kHz</option>
							<option>12 kHz</option>
							<option>8 kHz</option>
							<option>4 kHz</option>
							<option>2 kHz</option>
						</select>
					</label>
					<label>Volume<input id="echo-volume" type="number" min="-65" max="6" step="0.5" /></label>
				</fieldset>
			</details>
			<hr />
			<details open>
				<summary>Mixer View</summary>
				<form id="view">
					<fieldset class="custom-form">
							<label class="form-row">Routing Mode
								<select id="routing-mode" name="routingmode">
									<option value="submix">Submix</option>
									<option value="free">Free</option>
								</select>
							</label>
							<label class="form-row">Level Meter FX
								<div class="switch">
									<input id="meter-fx" name="meterfx" type="checkbox" />
									<span class="slider"></span>
								</div>
							</label>
							<label class="form-row">Level Meter RMS
								<div class="switch">
									<input id="meter-rms" name="meterrms" type="checkbox" />
									<span class="slider"></span>
								</div>
						</label> 
					</fieldset>
				</form>
			</details>
			<hr />

			<details open>
				<summary>Control Room</summary>
				<fieldset class="custom-form">
					<label class="form-row">Main Out
						<select id="controlroom-mainout">
							<option>Analog 1/2</option>
							<option>Analog 3/4</option>
							<option>Analog 5/6</option>
							<option>Analog 7/8</option>
							<option>Phones 9/10</option>
							<option>Phones 11/12</option>
							<option>AES L/R</option>
							<option>ADAT 1/2</option>
							<option>ADAT 3/4</option>
							<option>ADAT 5/6</option>
							<option>ADAT 7/8</option>
							<option>ADAT 9/10</option>
							<option>ADAT 11/12</option>
							<option>ADAT 13/14</option>
							<option>ADAT 15/16</option>
						</select>
					</label>
					<label class="form-row">Main Mono
						<div class="switch">
							<input id="controlroom-mainmono" type="checkbox" />
							<span class="slider"></span>
						</div>
					</label>
					<label class="form-row">Dim Reduction
						<input id="controlroom-dimreduction" type="number" min="-65" max="0" step="0.1" value="-20" />
					</label>
					<label class="form-row">Dim
						<div class="switch">
							<input id="controlroom-dim" type="checkbox" />
							<span class="slider"></span>
						</div>
					</label>
					<label class="form-row">Recall Volume
						<input id="controlroom-recallvolume" type="number" min="-65" max="0" step="0.1" value="-10" />
					</label>
				</fieldset>
			</details>
			<hr />
			
			<details>
				<summary>DURec</summary>
				<fieldset class="custom-form">
					<label class="form-row">File:
						<select id="durec-file">
							<option value="-1">New Recording...</option>
						</select>
					</label>
					<label class="form-row">Samplerate: <output id="durec-samplerate">---</output>Hz</label>
					<label class="form-row">Channels: <output id="durec-channels">---</output></label>
					<label class="form-row">Time:<input type="range" id="durec-time" min="0" max="0" step="1" /></label>
					<output id="durec-time-display">00:00:00</output>
					<div class="durec-controls">
						<button id="durec-play">Play Pause</button>
						<button id="durec-stop">Stop</button>
						<button id="durec-record">Rec</button>
						<button id="durec-stoprecord">Rec Stop</button>
						<button id="durec-delete">Del</button>
					</div>
				</fieldset>
			</details>
			<hr />
			
			<details open>
				<summary>Hardware</summary>
				<fieldset class="custom-form">
					<label class="form-row">LCD Contrast
						<input
						type="range"
						id="hardware-lcdcontrast"
						orient="horizontal"
						min="-20"
						max="20"
						step="1"
						value="0" />
					</label>
					<label class="form-row">Clock Source
						<select id="clock-source">
							<option>Internal</option>
							<option>Word Clock</option>
							<option>AES (S/PDIF)</option>
							<option>Opt. 1 (AES)</option>
							<option>Opt. 2 (Optical)</option>
							<option>MADI Opt.</option>
							<option>MADI Coax.</option>
						</select>
					</label>
					<label class="form-row">Sample Rate<output id="clock-samplerate">---</output>Hz</label>
					<label class="form-row">Wck. Out
						<div class="switch">
							<input id="clock-wckout" type="checkbox" />
							<span class="slider"></span>
						</div>
					</label>
					<label class="form-row">Wck. Single
						<div class="switch">
							<input id="clock-wcksingle" type="checkbox" />
							<span class="slider"></span>
						</div>
					</label>
					<label class="form-row">Wck. Term.
						<div class="switch">
							<input id="clock-wckterm" type="checkbox" />
							<span class="slider"></span>
						</div>
					</label>
					<label class="form-row">AES In
						<select id="hardware-aesin">
							<option>XLR</option>
							<option>Opt. 2</option>
						</select>
					</label>
					<label class="form-row">AES State Pro
						<select id="hardware-spdifout">
							<option>Consumer</option>
							<option>Professional</option>
						</select></label>
					<label class="form-row">Opt. 1 In
						<select id="hardware-opticalin">
							<option>ADAT</option>
							<option>S/PDIF</option>
						</select>
					</label>
					<label class="form-row">Opt. 1 Out
						<select id="hardware-opticalout">
							<option>ADAT</option>
							<option>S/PDIF</option>
						</select>
					</label>
					<label class="form-row">Opt. 2 In
						<select id="hardware-opticalin2">
							<option>ADAT</option>
							<option>S/PDIF</option>
							<option>AES</option>
						</select>
					</label>
					<label class="form-row">Opt. 2 Out
						<select id="hardware-opticalout2">
							<option>ADAT</option>
							<option>S/PDIF</option>
							<option>AES</option>
						</select>
					</label>
					<label class="form-row">MADI In
						<select id="hardware-madiinput">
							<option>Optical</option>
							<option>Coaxial</option>
							<option>Auto</option>
							<option>Split</option>
						</select>
					</label>
					<label class="form-row">MADI Out
						<select id="hardware-madioutput">
							<option>Optical</option>
							<option>Mirror</option>
							<option>Split</option>
						</select>
					</label>
					<label class="form-row">MADI Frame
						<select id="hardware-madiframe">
							<option>96K Frame</option>
							<option>48K Frame</option>
						</select>
					</label>
					<label class="form-row">MADI Format
						<select id="hardware-madiformat">
							<option>56 (28) ch</option>
							<option>64 (32 ch)</option>
						</select>
					</label>
					<label class="form-row">Record EQ+D
						<div class="switch">
							<input id="hardware-eqdrecord" type="checkbox" />
							<span class="slider"></span>
						</div>
					</label>
					<label class="form-row">DSP Available
						<output id="hardware-dspavail"></output>
					</label>
					<label class="form-row">DSP Status
						<output id="hardware-dspstatus"></output>
					</label>
					<label class="form-row">CC Mode
						<div class="switch">
							<input id="hardware-ccmode" type="checkbox" />
							<span class="slider"></span>
						</div>
					</label>
					<label class="form-row">Interface Mode
						<select id="hardware-interfacemode">
							<option>Auto</option>
							<option>USB2</option>
							<option>USB3</option>
							<option>CC</option>
						</select>
					</label>
					<label class="form-row">CC Mix
						<select id="hardware-ccmix">
							<option>TotalMix</option>
							<option>6 ch. + phones</option>
							<option>8 ch.</option>
							<option>20 ch.</option>
						</select>
					</label>

					<label class="form-row">CC Routing
						<select id="hardware-ccrouting">
							<option>All Ch.</option>
							<option>Phones</option>
						</select>
					</label>
					<label class="form-row">Standalone MIDI
						<select id="hardware-standalonemidi">
							<option>Off</option>
							<option>MIDI 1</option>
							<option>MIDI 2</option>
						</select>
					</label>
					<label class="form-row">Standalone ARC
						<select id="hardware-standalonearc">
							<option>Volume</option>
							<option>1s Op</option>
							<option>Normal</option>
						</select>
					</label>
				</fieldset>
			</details>
			<hr />
			
			<details>
				<summary>Keys</summary>
				<fieldset class="custom-form">
					<label class="form-row">Lock Keys
						<select id="hardware-lockkeys">
							<option>Off</option>
							<option>Keys</option>
							<option>All</option>
						</select>
					</label>
					<label class="form-row">Remap Keys
						<div class="switch">
							<input id="hardware-remapkeys" type="checkbox" />
							<span class="slider"></span>
						</div>
					</label>
					<label class="form-row">MIC / GAIN
						<select id="hardware-programkey01"></select>
					</label>
					<label class="form-row">REC / PLAY
						<select id="hardware-programkey02"></select>
					</label>
					<label class="form-row">CHAN / MIX
						<select id="hardware-programkey03"></select>
					</label>
					<label class="form-row">SETUP / REV
						<select id="hardware-programkey04"></select>
					</label>
				</fieldset>
			</details>
			<hr />
			
			<details>
				<summary>Setups</summary>
				<form id="setup" title="Setup Slots">

						<fieldset class="custom-form">
							<label class="toggle-button form-row" title="Setup 1">Setup 1
								<input type="radio" name="setup-slot" value="0" class="setup-slot" />
							</label>
							<label class="toggle-button form-row" title="Setup 2">Setup 2
								<input type="radio" name="setup-slot" value="1" class="setup-slot" />
							</label>
							<label class="toggle-button form-row" title="Setup 3">Setup 3
								<input type="radio" name="setup-slot" value="2" class="setup-slot" />
							</label>
							<label class="toggle-button form-row" title="Setup 4">Setup 4
								<input type="radio" name="setup-slot" value="3" class="setup-slot" />
							</label>
							<label class="toggle-button form-row" title="Setup 5">Setup 5
								<input type="radio" name="setup-slot" value="4" class="setup-slot" />
							</label>
							<label class="toggle-button form-row" title="Setup 6">Setup 6
								<input type="radio" name="setup-slot" value="5" class="setup-slot" />
							</label>
						</fieldset>
					</div>
					<div class="controlroom-button-group">
						<fieldset>
								<input id="store-button" type="button" value="Store" title="Store current state into selected setup slot on device" />
								<input id="load-button" type="button" value="Load" title="Load selected setup state from device (Doesn't work yet - needs to be implemented)" />
						</fieldset>
					</div>
				</form>
			</details>

			<details>
				<summary>ARC USB</summary>
				<fieldset class="custom-form">

					</label>
				</fieldset>
			</details>
			<hr />
				<details>
				<summary>UI Settings</summary>
				<form id="ui-settings">

							<button type="button" class="help-button" id="url-help-button">Open</button>
						</label>
						<label class="form-row" title="Select your preferred UI Theme">Theme:
							<select id="ui-style-select">
								<option value="css/theme/tm_dark_hi.css">TM Dark (High Contrast)</option>
								<option value="css/theme/tm_dark.css">TM Dark</option>
								<option value="css/theme/tm_light.css">TM Light</option>
								<option value="css/theme/led_light.css">LED Light</option>
								<option value="css/theme/default.css">Minimal</option>
								<option value="css/theme/cust.css">Custom</option>
							    <option value="css/theme/test.css">Test</option>
							</select>
						</label>
					</fieldset>
				</form>
			</details>
			<hr />
			
			<div id="help-container"></div>
			<details>
				<summary>Debug</summary>
				<form id="debug">
					<fieldset class="custom-form">
							<label class="form-row"  title="General OSC Log switch. Affects all below OSC related switches in Broser Console. For better Performance, disable if not needed.">
							OSC Log (general)
							<div class="switch">
								<input type="checkbox" id="debug-other" />
								<span class="slider"></span>
							</div>
						</label>
						<label class="form-row"  title="Logs incoming OSC Messages in Broser Console. For better Performance, disable if not needed.">
							OSC Incoming
							<div class="switch">
								<input type="checkbox" id="debug-incoming" />
								<span class="slider"></span>
							</div>
						</label>
						<label class="form-row"  title="Logs outgoing OSC Messages in Broser Console. For better Performance, disable if not needed.">
							OSC Outgoing
							 <div class="switch">
								<input type="checkbox" id="debug-outgoing"/>
								<span class="slider"></span>
							</div>
						</label>
						<label class="form-row"  title="Logs Level-Meter OSC Messages in Broser Console. Floods the Console! Enable only if needed.">
							OSC Levels
							<div class="switch">
								<input type="checkbox" id="debug-level" />
								<span class="slider"></span>
							</div>
						</label>
						<label class="form-row"  title="Logs ARC USB related OSC Messages in Broser Console. For better Performance, disable if not needed.">
							OSC ARC Messages
							<div class="switch">
								<input type="checkbox" id="debug-arc" />
								<span class="slider"></span>
							</div>
						</label>
					</fieldset>
					<hr />
					<fieldset class="custom-form">
						<label class="form-row" title="Debug log sent directly from oscmix(.wasm). Sends /debug ,i N to oscmix. 0=off 1=mix events 2=register detail 3=verbose (every setreg) 4=Full (Flood warning!)">
							WASM Log
							<select id="debug-wasm-level">
								<option value="d0">L0 - Off</option>
								<option value="d1">L1 - Mix Events</option>
								<option value="d2">L2 - Reg Details</option>
								<option value="d3">L3 - More Verbose</option>
								<option value="d4">L4 - Full (!)</option>
							</select>
						</label>
					</fieldset>
					<hr  style="background: transparent;" />
					<fieldset class="custom-form">
						<label class="label-legend">Register/Value</label>
						<label class="form-row" >Reg (0x...)
							<input id="debug-register" />
						</label>
						<label class="form-row" >Val (0x...)
							<input id="debug-value" />
						</label>
						<div>
						<label class="form-row" >Send to Unit
							<button id="debug-set-register">Fire!</button>
						</label>
						</div>
					</fieldset>
			</form>
			</details>
