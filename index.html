<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OscMix Web</title>
<meta name="author" content="Martin Augustyniak">
<meta name="copyright" content="2026 Martin Augustyniak">
<meta name="dcterms.license" content="GPL-3.0-or-later">
<link rel="author" href="https://github.com/huddx01">
<link rel="license" href="https://www.gnu.org/licenses/gpl-3.0.html">
<meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1" />
<link rel="icon" href="assets/icons/AppIcon-macOS-Default-32@1x.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: light)">
<link rel="icon" href="assets/icons/AppIcon-macOS-Default-16@1x.png" sizes="16x16" type="image/png" media="(prefers-color-scheme: light)">
<link rel="icon" href="assets/icons/AppIcon-macOS-Dark-32@1x.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/icons/AppIcon-macOS-Dark-16@1x.png" sizes="16x16" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/icons/AppIcon-macOS-Dark-180@1x.png">
<link rel="manifest" href="assets/icons/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OscMix Web">
<meta name="theme-color" content="#101114">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/strip.css">
<link rel="stylesheet" href="css/fader.css">
<link rel="stylesheet" href="css/swatchPicker.css">
<link rel="stylesheet" href="css/meter.css">
<link rel="stylesheet" href="css/toggle.css">
<link rel="stylesheet" href="css/knob.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/setPanel.css">
<link rel="stylesheet" href="css/eqPanel.css">
<link rel="stylesheet" href="css/dynPanel.css">
<link rel="stylesheet" href="css/outputSelect.css">
<link rel="stylesheet" href="css/fxColumn.css">
<link rel="stylesheet" href="css/controlStrip.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
	<header class="topbar">
		<div class="topbar-left">
			<span class="title">OscMix Web</span>
			<span id="status" class="status">connecting…</span>
		</div>
		<div class="topbar-center">
			<span id="device" class="device">—</span>
			<span id="online" class="online" title="device connection">●</span>
			<span id="dsp" class="dsp"></span>
		</div>
		<div class="topbar-right">
			<button id="fx-toggle" class="topbar-btn" title="show/hide FX">FX</button>
			<button id="control-strip-toggle" class="topbar-btn" title="show Control Strip">◧</button>
		</div>
	</header>

	<div id="main">
		<main id="mixer">
			<section class="row" data-bus="input">
				<div class="row-body">
					<div class="row-strips" id="row-input"></div>
				</div>
				<div class="row-foot">
					<button class="row-label row-toggle" type="button" data-bus="input"><span class="row-chev">▾</span>hardware inputs</button>
					<div class="row-scroll"><div class="row-scroll-thumb"></div></div>
				</div>
				<div class="row-dock"></div>
			</section>
			<section class="row" data-bus="playback">
				<div class="row-body">
					<div class="row-strips" id="row-playback"></div>
				</div>
				<div class="row-foot">
					<button class="row-label row-toggle" type="button" data-bus="playback"><span class="row-chev">▾</span>software playbacks</button>
					<div class="row-scroll"><div class="row-scroll-thumb"></div></div>
				</div>
				<div class="row-dock"></div>
			</section>
			<section class="row" data-bus="output">
				<div class="row-body">
					<div class="row-strips" id="row-output"></div>
				</div>
				<div class="row-foot">
					<button class="row-label row-toggle" type="button" data-bus="output"><span class="row-chev">▾</span>hardware outputs</button>
					<div class="row-scroll"><div class="row-scroll-thumb"></div></div>
				</div>
				<div class="row-dock"></div>
			</section>
						<div id="dock-pool" hidden>
				<div class="fx-slot dock-item dock-fx" id="fx-reverb" data-dock="reverb"></div>
				<div class="fx-slot dock-item dock-fx" id="fx-echo" data-dock="echo"></div>
				<div class="dock-item dock-fx fx-channel" id="fx-in" data-dock="fxin"></div>
				<div class="dock-item dock-fx fx-channel" id="fx-out" data-dock="fxout"></div>
				<div class="dock-item cr-block" id="cr-block" data-dock="cr">
					<div class="cr-region empty" id="cr-output"></div>
					<div class="fx-slot" id="fx-controlroom"></div>
					<div class="cr-foot">
						<button class="row-label row-toggle cr-toggle" type="button"><span class="row-chev">▾</span>control room</button>
						<div class="row-scroll"><div class="row-scroll-thumb"></div></div>
					</div>
				</div>
			</div>
		</main>
		<aside id="control-strip"></aside>
	</div>

	<script type="module" src="static.js"></script>
</body>
</html>
